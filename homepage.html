<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Image Gallery</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2e2e2e;
            color: #000000;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #96666200;
            color: rgb(255, 116, 109);
            padding: 20px;
            font-size: 3rem;
            text-align: center;
        }

        .post-form {
            background-color: rgb(255, 116, 109);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin: 20px;
        }

        .gallery {
            column-count: 3;
            column-gap: 15px;
            padding: 15px;
        }

        .gallery img {
            width: 100%;
            margin-bottom: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
            object-fit: cover;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1050;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 70%;
            max-height: 90%;
            overflow: auto;
            transition: all 0.3s ease;
        }

        .modal img {
            display: block;
            max-width: 100%;
            max-height: 90vh;
            margin: 0 auto;
            border-radius: 8px;
            object-fit: contain;
        }

        .modal h5 {
            margin-top: 15px;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            font-size: 24px;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 9999;
            transition: background-color 0.3s;
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 767px) {
            .gallery {
                column-count: 2;
            }

            .modal-content {
                max-width: 95%;
                max-height: 95%;
            }
        }
    </style>
</head>
<body>

<div class="header">
    Eclipse
</div>

<div class="container mt-4">
    <div class="post-form">
        <form id="post-form">
            <h3 class="text-center">Создать пост</h3>
            <div class="form-group">
                <label for="name">Имя:</label>
                <input type="text" id="name" class="form-control" required placeholder="Введите ваше имя">
            </div>
            <div class="form-group">
                <label for="class">Класс:</label>
                <input type="text" id="class" class="form-control" required placeholder="Введите ваш класс">
            </div>
            <div class="form-group">
                <label for="description">Описание:</label>
                <textarea id="description" class="form-control" required rows="3" placeholder="Введите описание"></textarea>
            </div>
            <input type="file" class="form-control mb-3" id="image" accept="image/*" required>
            <div class="text-center">
                <button type="button" class="btn btn-custom" id="upload-btn" onclick="upload()">Загрузить</button>
            </div>
        </form>
        <p id="status-message" class="text-center mt-3"></p>
    </div>

    <div class="gallery" id="posts"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <img id="modal-image" src="" alt="Modal Image">
        <h5 id="modal-title"></h5>
        <p id="modal-description"></p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/7.14.2/firebase.js"></script>
<script>
    var firebaseConfig = {
        apiKey: "AIzaSyDj6o_BvyuXiHlop80SGA1UiG17XfhOnyE",
        authDomain: "blogs-957a9.firebaseapp.com",
        databaseURL: "https://blogs-957a9-default-rtdb.firebaseio.com",
        projectId: "blogs-957a9",
        storageBucket: "blogs-957a9.appspot.com",
        messagingSenderId: "160842509516",
        appId: "1:160842509516:web:7da2312ccc8f6277dc6669",
        measurementId: "G-5YGKQ3QP31"
    };
    firebase.initializeApp(firebaseConfig);

    function upload() {
        var uploadButton = document.getElementById("upload-btn");
        var image = document.getElementById('image').files[0];
        var name = document.getElementById('name').value;
        var className = document.getElementById('class').value;
        var description = document.getElementById('description').value;

        if (!name || !className || !description || !image) {
            alert("Пожалуйста, заполните все поля.");
            return;
        }

        uploadButton.disabled = true;
        uploadButton.innerHTML = "Загрузка...";

        var imageName = image.name;
        var storageRef = firebase.storage().ref('images/' + imageName);

        var uploadTask = storageRef.put(image);

        uploadTask.on('state_changed', function(snapshot) {
            var progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
            console.log("Upload is " + progress + "% done");
        }, function(error) {
            console.error("Error uploading image: ", error);
            document.getElementById("status-message").textContent = "Ошибка при загрузке. Попробуйте еще раз.";
            uploadButton.disabled = false;
            uploadButton.innerHTML = "Загрузить";
        }, function() {
            uploadTask.snapshot.ref.getDownloadURL().then(function(downloadURL) {
                var post = {
                    name: name,
                    class: className,
                    description: description,
                    imageURL: downloadURL
                };
                firebase.database().ref('blogs/').push(post);
                document.getElementById('post-form').reset();
                document.getElementById("status-message").textContent = "Ваш пост опубликован!";
                uploadButton.disabled = false;
                uploadButton.innerHTML = "Загрузить";
            });
        });
    }

    function openModal(postData) {
        var modal = document.getElementById('modal');
        var modalImage = document.getElementById('modal-image');
        document.getElementById('modal-title').textContent = `${postData.name} (${postData.class})`;
        document.getElementById('modal-description').textContent = postData.description;
        modalImage.src = postData.imageURL;

        // Check image aspect ratio to adjust modal size
        var img = new Image();
        img.src = postData.imageURL;
        img.onload = function() {
            var aspectRatio = img.width / img.height;
            var modalContent = document.querySelector('.modal-content');

            if (aspectRatio > 1) {  // Landscape (wide) image
                modalContent.style.maxWidth = '80%';
                modalContent.style.maxHeight = '75%';
            } else {  // Portrait (tall) image
                modalContent.style.maxWidth = '70%';
                modalContent.style.maxHeight = '90%';
            }

            modal.style.display = 'flex';
        };
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    firebase.database().ref('blogs/').on('value', function(snapshot) {
        var postsContainer = document.getElementById('posts');
        postsContainer.innerHTML = '';
        snapshot.forEach(function(childSnapshot) {
            var postData = childSnapshot.val();
            var img = document.createElement('img');
            img.src = postData.imageURL;
            img.alt = "Post Image";
            img.onclick = function() { openModal(postData); };
            postsContainer.appendChild(img);
        });
    });
</script>
</body>
</html>
