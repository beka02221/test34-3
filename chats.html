<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анонимный чат</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #2c3e50;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      background-color: #34495e;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 80%;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      color: #ecf0f1;
      font-size: 16px;
    }

    .input-container {
      display: flex;
      padding: 10px;
      background-color: #2c3e50;
    }

    #message-input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      margin-right: 10px;
      background-color: #ecf0f1;
    }

    #send-btn {
      background-color: #ff746d;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    #send-btn:hover {
      background-color: #16a085;
    }

    .message {
      margin-bottom: 10px;
    }

    .message span {
      font-weight: bold;
      margin-right: 10px;
    }

    .message p {
      display: inline;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-box" id="chat-box"></div>
    <div class="input-container">
      <input type="text" id="message-input" placeholder="Введите сообщение..." />
      <button id="send-btn">Отправить</button>
    </div>
  </div>

  <script>
    // Инициализация переменной для хранения сообщений в формате JSON
    let messages = [];

    // Функция для отображения сообщений
    function displayMessages() {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = ''; // Очищаем чат

      // Преобразуем сообщения в JSON и отображаем их
      const messagesJSON = JSON.parse(localStorage.getItem('messages') || '[]');
      messagesJSON.forEach((msg) => {
        const messageElement = document.createElement('div');
        messageElement.classList.add('message');
        messageElement.innerHTML = `<span>Аноним:</span><p>${msg}</p>`;
        chatBox.appendChild(messageElement);
      });
      chatBox.scrollTop = chatBox.scrollHeight; // Автоматическая прокрутка вниз
    }

    // Функция для отправки сообщения
    document.getElementById('send-btn').addEventListener('click', () => {
      const input = document.getElementById('message-input');
      const message = input.value.trim();
      if (message) {
        // Добавляем сообщение в массив
        messages.push(message);

        // Сохраняем сообщения в JSON в localStorage
        localStorage.setItem('messages', JSON.stringify(messages));

        displayMessages(); // Обновляем чат
        input.value = ''; // Очищаем поле ввода
      }
    });

    // Обработка нажатия клавиши Enter для отправки сообщения
    document.getElementById('message-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('send-btn').click();
      }
    });

    // Отображаем сообщения при загрузке страницы
    displayMessages();
  </script>

</body>
</html>
